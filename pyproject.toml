[project]
name = "cathon"
version = "0.0.1"
authors = [{ name = "HBcao233", email = "hbcaoqaq@gmail.com" }]
readme = "README.md"
license = { file = "LICENSE" }
keywords = ["cat"]
requires-python = ">=3.9"

[project.scripts]
cathon = "cathon.cli:main"

[project.urls]
Homepage = "https://github.com/HBcao233/cathon"



[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cathon"]


[tool.ruff]
line-length = 88
indent-width = 2
builtins = ["bot"]

[tool.ruff.format]
# Prefer single quotes over double quotes.
quote-style = "single"

[tool.ruff.lint]
ignore = ["E402", "F401", "F403", "F405"]